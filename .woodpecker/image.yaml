# Container image build check (no push). Proves release/railway/Dockerfile still
# builds, using an unprivileged builder: no privileged step, no host socket, no
# added capabilities, no secrets. Publishing stays a release-time job (see
# check.yaml).
when:
  - event: pull_request
  - event: push
    branch: main
  - event: manual

steps:
  - name: image-build
    image: gcr.io/kaniko-project/executor:v1.24.0-debug@sha256:2562c4fe551399514277ffff7dcca9a3b1628c4ea38cb017d7286dc6ea52f4cd
    commands:
      - >-
        /kaniko/executor
        --no-push
        --context "$CI_WORKSPACE/release/railway"
        --dockerfile "$CI_WORKSPACE/release/railway/Dockerfile"
        --tar-path /tmp/image.tar
        --verbosity info
