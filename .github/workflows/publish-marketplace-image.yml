name: Publish Marketplace image

on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish, without the leading v
        required: true
        default: 0.1.3
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Verify release manifests
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          tag="${{ inputs.image_tag }}"
          if [ -z "$tag" ]; then tag="${RELEASE_TAG#v}"; fi
          test -n "$tag"
          case "$tag" in
            *.*.*) ;;
            *) echo "image_tag must be a semantic version" >&2; exit 1 ;;
          esac
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$tag" = "${RELEASE_TAG#v}"
          fi
          shasum -a 256 -c release/railway/build-input-manifest.sha256
          shasum -a 256 -c release/railway/bundle-manifest.sha256
          source_ref="$(sed -n 's/.*Source snapshot: `\([^`]*\)`.*/\1/p' release/railway/RELEASE.md)"
          test "$source_ref" != "SOURCE_SNAPSHOT_COMMIT"
          expected_source="$(tr -d '[:space:]' < release/railway/SOURCE-SHA256)"
          actual_source="$(git archive --format=tar "$source_ref" | shasum -a 256 | awk '{print $1}')"
          test "$actual_source" = "$expected_source"
          echo "IMAGE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Build and publish the immutable image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          image="ghcr.io/tealbrick/marketplace:${IMAGE_TAG}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build \
            --label org.opencontainers.image.source=https://github.com/Tealbrick/marketplace \
            --label org.opencontainers.image.version="$IMAGE_TAG" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t "$image" release/railway
          docker push "$image"
          digest="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')"
          echo "image=$digest" >> "$GITHUB_STEP_SUMMARY"
          echo "source=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "IMAGE_REF=$digest" >> "$GITHUB_ENV"

      - name: Verify the actual published image
        run: |
          set -eu
          docker pull "$IMAGE_REF"
          docker run --rm --entrypoint node "$IMAGE_REF" -e 'const fs = require("node:fs"); const source = fs.readFileSync("/app/dist/marketplace-program.mjs", "utf8"); for (const marker of ["/api/portal/readiness", "/api/rules/gateway/introspect", "active: true"]) { if (!source.includes(marker)) throw new Error(`missing ${marker}`); }'
          name="marketplace-release-smoke-${GITHUB_RUN_ID}"
          docker run -d --rm --name "$name" -p 5314:5314 "$IMAGE_REF"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5314/healthz >/dev/null; then break; fi
            test "$attempt" -lt 30
            sleep 2
          done
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:5314/api/status)"
          test "$code" = 401 || test "$code" = 403 || test "$code" = 503
          docker rm -f "$name" >/dev/null
          trap - EXIT

      - name: Verify persistence, encrypted recovery, idempotency, and revocation
        env:
          SMOKE_BASE_URL: http://127.0.0.1:5314
          SMOKE_PORTAL_ISSUER: http://host.docker.internal:5317
          SMOKE_ORGANIZATION_ID: smoke-org
          SMOKE_INTERNAL_TOKEN: smoke-internal-token
          MARKETPLACE_HANDOFF_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: |
          set -eu
          state_dir="$(mktemp -d)"
          backup_dir="$(mktemp -d)"
          restored_dir="$(mktemp -d)"
          wrong_key_dir="$(mktemp -d)"
          chmod 0777 "$state_dir" "$restored_dir" "$wrong_key_dir"
          image="$IMAGE_REF"
          name="marketplace-contract-smoke-${GITHUB_RUN_ID}"

          start_marketplace() {
            mount_dir="$1"
            docker run -d --rm --name "$name" \
              --add-host host.docker.internal:host-gateway \
              -p 5314:5314 \
              -v "$mount_dir:/data/state" \
              -e NODE_ENV=production \
              -e MARKETPLACE_HOST=0.0.0.0 \
              -e MARKETPLACE_PORT=5314 \
              -e MARKETPLACE_DATA_DIR=/data/state \
              -e MARKETPLACE_OPERATOR_ACCESS_TOKEN=smoke-operator-token \
              -e MARKETPLACE_OPERATOR_ID=operator-smoke \
              -e MARKETPLACE_ORGANIZATION_ID=smoke-org \
              -e MARKETPLACE_INTERNAL_AUTH_TOKEN=smoke-internal-token \
              -e MARKETPLACE_ALLOWED_ORIGINS=http://127.0.0.1:5314 \
              -e MARKETPLACE_PUBLIC_ORIGIN=http://127.0.0.1:5314 \
              -e MARKETPLACE_HANDOFF_ENCRYPTION_KEY="$MARKETPLACE_HANDOFF_ENCRYPTION_KEY" \
              -e RULES_BASE_URL=http://host.docker.internal:5315 \
              -e RULES_COMPANY_ID=smoke-org \
              -e COMPOSIO_API_KEY=smoke-provider-key \
              -e COMPOSIO_BASE_URL=http://host.docker.internal:5316/v3.1 \
              -e COMPOSIO_CONNECT_BASE_URL=http://host.docker.internal:5316/v3 \
              -e COMPOSIO_EXECUTE_BASE_URL=http://host.docker.internal:5316/v3 \
              -e MARKETPLACE_PORTAL_ISSUER_URL=http://host.docker.internal:5317 \
              -e MARKETPLACE_PORTAL_INSTANCE_PROOF=ppppppppppppppppppppppppppppppppppppppppppp \
              -e MARKETPLACE_PORTAL_DEPLOYMENT_ID=deployment-smoke \
              -e MARKETPLACE_PORTAL_ORG_ID=portal-org-smoke \
              -e MARKETPLACE_PORTAL_WORKSPACE_ID=smoke-org \
              "$image" >/dev/null
            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:5314/healthz >/dev/null; then return 0; fi
              test "$attempt" -lt 30
              sleep 2
            done
            return 1
          }

          stop_marketplace() {
            docker stop --time 10 "$name" >/dev/null 2>&1 || docker rm -f "$name" >/dev/null 2>&1 || true
          }

          trap stop_marketplace EXIT
          start_marketplace "$state_dir"
          SMOKE_MODE=setup SMOKE_REDEEM_FAILURE_ONCE=1 node smoke/release-image-contract-smoke.mjs
          stop_marketplace

          start_marketplace "$state_dir"
          SMOKE_MODE=verify node smoke/release-image-contract-smoke.mjs
          stop_marketplace

          test -f "$state_dir/marketplace.sqlite"
          cp "$state_dir/marketplace.sqlite" "$backup_dir/marketplace.sqlite"
          cp "$backup_dir/marketplace.sqlite" "$restored_dir/marketplace.sqlite"
          chmod 0777 "$restored_dir"
          chmod 0666 "$restored_dir/marketplace.sqlite"
          start_marketplace "$restored_dir"
          SMOKE_MODE=verify node smoke/release-image-contract-smoke.mjs
          stop_marketplace

          cp "$backup_dir/marketplace.sqlite" "$wrong_key_dir/marketplace.sqlite"
          chmod 0777 "$wrong_key_dir"
          chmod 0666 "$wrong_key_dir/marketplace.sqlite"
          before_wrong_key="$(sha256sum "$wrong_key_dir/marketplace.sqlite" | awk '{print $1}')"
          if docker run --rm --name "$name" \
            --add-host host.docker.internal:host-gateway \
            -v "$wrong_key_dir:/data/state" \
            -e NODE_ENV=production \
            -e MARKETPLACE_HOST=0.0.0.0 \
            -e MARKETPLACE_PORT=5314 \
            -e MARKETPLACE_DATA_DIR=/data/state \
            -e MARKETPLACE_HANDOFF_ENCRYPTION_KEY=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            "$image" >/tmp/marketplace-wrong-key.log 2>&1; then
            echo "wrong handoff encryption key unexpectedly started the image" >&2
            exit 1
          fi
          after_wrong_key="$(sha256sum "$wrong_key_dir/marketplace.sqlite" | awk '{print $1}')"
          test "$before_wrong_key" = "$after_wrong_key"
          echo "image persistence/restart/restore, uncertain-write reconciliation, idempotency, revocation, and wrong-key no-overwrite checks passed" >> "$GITHUB_STEP_SUMMARY"
